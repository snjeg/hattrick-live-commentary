<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hattrick Live Commentary</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <main>
      <h1>Hattrick Live Commentary</h1>
      <p id="status" role="status" aria-live="polite">Ready. Press Start to begin the broadcast.</p>
      <div class="controls">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
      <p class="note">
        Audio starts only after you press Start. Keep this tab open while listening.
      </p>
    </main>
    <script type="module" src="page.js"></script>
  </body>
</html>
